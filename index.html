<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="En enkel AMA-chat om Anas."
    />
    <title>ama-bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <nav class="topbar" aria-label="Hovednavigation">
        <a class="brand" href="#top">AMA<span>.</span></a>
        <span class="nav-status"><i class="online-dot"></i> Online</span>
      </nav>

      <section class="chat-scene" id="top" aria-labelledby="ask-title">
        <div class="scene-heading">
          <p class="eyebrow"><span class="status-dot"></span> A-Boy</p>
          <h1 id="ask-title">Spørg<br /><em>løs.</em></h1>
        </div>

        <div class="phone" aria-label="Chat med Anas">
          <div class="phone-speaker"></div>
          <div class="phone-screen">
          <div class="chat-header">
            <img class="avatar" src="/images/no g.png" alt="Anas" />
            <div>
              <strong>A-Boy</strong>
              <span><i class="online-dot"></i> Klar til at svare</span>
            </div>
          </div>
          <div class="chat-messages" aria-label="Eksempel på en samtale">
            <div class="message message-bot">
              <p>Hej! Hvad vil du gerne vide om mig?</p>
              <time>12:04</time>
            </div>
            <div class="message message-user">
              <p>Hvad arbejder du med?</p>
              <time>12:05</time>
              </div>
              <div class="message message-bot">
              <p>Spørg mig om alt fra arbejde til interesser.</p>
              <time>12:05</time>
            </div>
          </div>
          <form class="ask-form" action="#ask" method="get" id="ask">
            <label class="sr-only" for="question">Skriv dit spørgsmål</label>
            <input id="question" name="question" type="text" placeholder="Skriv et spørgsmål..." autocomplete="off" />
            <button type="submit" aria-label="Send spørgsmål">↗</button>
          </form>
          </div>
          <div class="gameboy-controls" aria-hidden="true">
            <div class="d-pad"><span></span></div>
            <div class="action-buttons"><b>B</b><b>A</b></div>
          </div>
          <div class="gameboy-label">AMA-BOY</div>
        </div>
        <div class="speech speech-user"><span>SPØRG MIG<br />OM HVAD SOM HELST :)</span></div>
        <div class="portrait-badge"><img src="/images/no g.png" alt="Portræt af Anas" /></div>
      </section>

      <footer class="footer">
        <span>© 2026 Anas
        </span>
      </footer>
    </main>
  </body>
</html>
