<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="En enkel AMA-chat om Anas." />
    <title>ama-bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <nav class="topbar" aria-label="Hovednavigation">
        <a class="brand" href="#top">AMA<span>.</span></a>
        <span class="nav-status"><i class="online-dot"></i> Online</span>
      </nav>

      <section class="chat-scene" id="top" aria-labelledby="ask-title">
        <div class="scene-heading">
          <p class="eyebrow"><span class="status-dot"></span> A-Boy</p>
          <h1 id="ask-title">Spørg<br /><em>løs.</em></h1>
        </div>

        <div class="phone" aria-label="Chat med Anas">
          <div class="phone-speaker"></div>
          <div class="phone-screen">
            <div class="chat-header">
              <img class="avatar" src="/assets/images/no g.png" alt="Anas" />
              <div>
                <strong>A-Boy</strong>
                <span><i class="online-dot"></i> Klar til at svare</span>
              </div>
              <div class="char-counter"><span id="char-count">0</span>/200</div>
            </div>
            <div class="chat-messages" aria-label="Samtale"></div>
            <form class="ask-form" id="ask-form">
              <label class="sr-only" for="question">Stil dit spørgsmål her:</label>
              <input id="question" name="question" type="text" maxlength="200" placeholder="Stil dit spørgsmål..." autocomplete="off" />
              <button type="submit">Send</button>
            </form>
            <button type="button" id="clear-messages">Ryd beskeder</button>
            <p id="error-message" role="alert" hidden></p>
          </div>
          <div class="gameboy-controls" aria-hidden="true">
            <div class="d-pad"><span></span></div>
            <div class="action-buttons"><b>B</b><b>A</b></div>
          </div>
          <div class="gameboy-label">AMA-BOY</div>
        </div>
      </section>

      <section class="stats-section" aria-labelledby="stats-title">
        <p class="eyebrow">Samtalestatistik</p>
        <h2 id="stats-title">Spørgsmål fordelt på emner</h2>
        <ul class="stats-list">
          <li><span>Navn</span><strong id="stat-navn">0</strong></li>
          <li><span>Bosted</span><strong id="stat-bosted">0</strong></li>
          <li><span>Fritid</span><strong id="stat-fritid">0</strong></li>
          <li><span>Alder</span><strong id="stat-alder">0</strong></li>
        </ul>
      </section>

      <footer class="footer"><span>© 2026 Anas</span></footer>
    </main>
    <script src="/assets/script.js"></script>
  </body>
</html>
